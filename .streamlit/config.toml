[global]
# Vercel vendors packages outside site-packages; avoid Streamlit's dev-mode heuristic.
developmentMode = false

[theme]
primaryColor = "#0F766E"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B42"
font = "sans serif"

[server]
maxUploadSize = 4

[browser]
gatherUsageStats = false
